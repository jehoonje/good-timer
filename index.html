<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Good Timer</title>
<meta name="theme-color" content="#02070b">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Good Timer">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Rajdhani:wght@500;600;700&family=Share+Tech+Mono&family=Sora:wght@200;300;400&family=IBM+Plex+Sans+KR:wght@300;400;500&display=swap">
<link rel="stylesheet" href="/styles.css">
<link rel="stylesheet" href="/ps2.css">
</head>
<body>
<div class="glow" aria-hidden="true"><i></i><i></i><i></i></div>
<div class="grain" aria-hidden="true"></div>

<!-- Access code -->
<section class="view" id="gate" hidden>
  <form class="gate" id="gateForm" autocomplete="off" novalidate>
    <div class="gate-mark">GOOD TIMER</div>
    <label class="gate-label" for="gateInput">ACCESS CODE</label>
    <div class="gate-row">
      <input id="gateInput" name="code" type="text" inputmode="text" autocapitalize="characters" autocorrect="off"
             spellcheck="false" maxlength="9" placeholder="XXXX-XXXX" enterkeyhint="go" aria-describedby="gateMsg">
      <button class="gate-go" id="gateGo" type="submit" aria-label="Enter"><svg viewBox="0 0 24 24"><path d="M5 12h13M13 6l6 6-6 6"/></svg></button>
    </div>
    <div class="gate-msg" id="gateMsg" role="status"></div>
  </form>
</section>

<!-- Home: body parts -->
<section class="view" id="home" hidden>
  <div class="bar">
    <span class="eyebrow">GOOD TIMER</span>
    <button class="pill" data-history type="button">History</button>
  </div>
  <h1>What are you training today?</h1>
  <div id="resumeSlot"></div>
  <div class="parts" id="parts"></div>
</section>

<!-- Exercise list -->
<section class="view" id="list" hidden>
  <div class="bar">
    <button class="back" id="listBack" type="button"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M10 3 5 8l5 5"/></svg>Body parts</button>
  </div>
  <div class="list-head">
    <div class="fig" id="listFig"></div>
    <div>
      <h1 id="listTitle"></h1>
      <div class="eyebrow" id="listSub"></div>
    </div>
  </div>
  <div class="exs" id="exs"></div>
</section>

<!-- Timer -->
<section class="view" id="pad" hidden role="button" tabindex="0" aria-label="Double-tap to switch between set and break">
  <div class="bar">
    <div class="ex-title">
      <div class="ex-row">
        <button class="back icon" id="timerBack" type="button" aria-label="Back to exercises"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M10 3 5 8l5 5"/></svg></button>
        <span class="ex-name" id="exName"></span>
      </div>
      <span class="eyebrow" id="setLabel">SET 1</span>
    </div>
    <div class="actions">
      <button class="pill" id="endBtn" type="button">End</button>
    </div>
  </div>
  <div class="center">
    <div class="setup" id="setup" hidden>
      <div class="su-step" id="suSets">
        <div class="su-label">SETS</div>
        <div class="su-stepper">
          <button type="button" class="rk" id="suMinus" aria-label="Fewer sets">−</button>
          <span class="su-num" id="suNum">4</span>
          <button type="button" class="rk" id="suPlus" aria-label="More sets">+</button>
        </div>
        <button type="button" class="pill primary" id="suNext">Next</button>
      </div>
      <div class="su-step" id="suWeights" hidden>
        <div class="su-label">WEIGHT · KG</div>
        <div class="su-list" id="suList"></div>
        <div class="su-actions">
          <button type="button" class="pill quiet" id="suBack">Back</button>
          <button type="button" class="pill primary" id="suDone">Done</button>
        </div>
      </div>
      <button type="button" class="su-summary" id="suSummary" hidden></button>
    </div>
    <button class="start" id="startBtn" type="button" aria-label="Start set 1">
      <span class="halo" aria-hidden="true"></span>
      <span class="rim" aria-hidden="true"></span>
      <span class="face"><span class="lbl">START</span><small>SET 1</small></span>
    </button>
    <div class="stage" id="stage" hidden aria-hidden="true"><span class="stage-band"></span><span id="stageText"></span></div>
    <div class="clock" id="clock">
      <div id="time"><span id="mm">0:00</span><span class="cs" id="cs">.00</span></div>
    </div>
    <div class="status" id="status" aria-live="polite"></div>
  </div>
  <div class="foot" id="foot">
    <div class="reps" id="reps" hidden>
      <div class="reps-total"><span class="reps-num" id="repsNum">0</span><small>REPS</small><span class="reps-parts" id="repsParts" hidden></span></div>
      <button type="button" class="rk" data-rep="1" aria-label="Add 1 rep">1</button>
      <button type="button" class="rk" data-rep="2" aria-label="Add 2 reps">2</button>
      <button type="button" class="rk ctl" id="repsUndo" aria-label="Undo last (hold to clear)"><svg viewBox="0 0 24 24"><path d="M9 7 4 12l5 5M4 12h11a5 5 0 0 1 0 10h-2"/></svg></button>
      <button type="button" class="rk ok" id="repsOk" aria-label="Save reps for this set"><svg viewBox="0 0 24 24"><path d="M5 12.5 10 17 19 7"/></svg></button>
    </div>
    <button type="button" class="reps-done" id="repsDone" hidden><svg viewBox="0 0 24 24"><path d="M5 12.5 10 17 19 7"/></svg><b id="repsDoneNum">0</b> REPS<span>EDIT</span></button>
    <div id="log"></div>
    <div class="hint" id="hint">Double-tap when the set is done</div>
  </div>
</section>

<div class="sheet" id="sheet" hidden>
  <div class="sheet-card" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
    <div class="sheet-head">
      <h2 id="sheetTitle">History</h2>
      <button class="pill" id="closeSheet" type="button">Close</button>
    </div>
    <div class="list" id="hist"></div>
    <div class="detail" id="histDetail" hidden>
      <div class="dt-head">
        <button class="back icon" id="dtBack" type="button" aria-label="Back to history"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M10 3 5 8l5 5"/></svg></button>
        <div class="dt-meta"><h2 class="dt-title" id="dtTitle"></h2><div class="dt-sub" id="dtSub"></div></div>
      </div>
      <div class="dt-cols"><span>SET</span><span>KG</span><span>REPS</span><span>TIME</span></div>
      <div class="dt-sets" id="dtSets"></div>
      <div class="sheet-actions">
        <button class="pill quiet" id="dtDelete" type="button">Delete</button>
        <button class="pill primary" id="dtSave" type="button">Save</button>
      </div>
    </div>
    <div class="note" id="syncNote" hidden></div>
    <div class="sheet-actions" id="mainActions">
      <button class="pill quiet" id="signOutBtn" type="button">Sign out</button>
      <button class="pill" id="clearBtn" type="button">Clear all</button>
    </div>
  </div>
</div>

<div class="modal" id="endModal" hidden>
  <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="endTitle">
    <div class="eyebrow" id="endTitle">FINISH EXERCISE</div>
    <h2 id="endEx"></h2>
    <div class="summary" id="endSummary"></div>
    <div class="modal-actions">
      <button class="pill quiet" id="discardBtn" type="button">Discard</button>
      <button class="pill primary" id="saveBtn" type="button">Save</button>
    </div>
    <button class="keep" id="keepBtn" type="button">Keep going</button>
  </div>
</div>

<div class="toast" id="toast" hidden></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="/config.js"></script>
<script src="/sync.js"></script>
<script src="/app.js"></script>
</body>
</html>
